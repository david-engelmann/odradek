[package]
name = "zombie-hunt"
version = "0.1.0"
edition = "2024"
description = "Proves zombie workloads from recorded cluster snapshots and writes reversible quarantine plans"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
